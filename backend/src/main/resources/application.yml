server:
  port: ${PORT:8080}
spring:
  application:
    name: zynckle-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/zynckle;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  # The schema lives in db/migration and is applied on startup, before any bean touches the database.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # Databases created by the old startup code have tables but no history: baseline them at 0,
    # then run the (idempotent) migrations to fill any gaps.
    baseline-on-migrate: true
    baseline-version: 0
    # The pre-Java V1–V3 files were removed; don't fail on databases that recorded them.
    ignore-migration-patterns: "*:missing"
  mvc:
    async:
      # AI answers stream over server-sent events; allow long generations.
      request-timeout: 180s
management:
  endpoints:
    web:
      exposure:
        include: health,info
