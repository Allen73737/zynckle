<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="320" fill="none">
  <defs>
    <linearGradient id="qc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070a" />
      <stop offset="100%" stop-color="#0c0d12" />
    </linearGradient>

    <linearGradient id="modal-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <linearGradient id="chip-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <style>
      @keyframes blink-bar {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes chip-fade-in {
        0% { opacity: 0.6; transform: translateY(2px); }
        50% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0.6; transform: translateY(2px); }
      }
      @keyframes border-shimmer {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      .caret-pulse {
        animation: blink-bar 1.1s steps(2, start) infinite;
      }
      .chip-animate {
        animation: chip-fade-in 3s ease-in-out infinite;
      }
      .modal-frame {
        animation: border-shimmer 4s ease-in-out infinite;
      }
      .code-font {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="320" rx="14" fill="url(#qc-bg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Floating Quick Capture Modal -->
  <g transform="translate(100, 32)">
    <!-- Modal Window Body -->
    <rect width="900" height="256" rx="12" fill="#09090d" stroke="url(#modal-border)" stroke-width="1.5" class="modal-frame" />

    <!-- Top Modal Header -->
    <g transform="translate(24, 20)">
      <rect width="210" height="22" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="10" y="15" fill="#a1a1aa" font-size="10.5" font-weight="700" letter-spacing="1" class="code-font">
        QUICK CAPTURE <tspan fill="#52525b">|</tspan> <tspan fill="#e4e4e7">HOTKEY: [ C ]</tspan>
      </text>

      <text x="852" y="15" fill="#71717a" font-size="11" text-anchor="end" class="code-font">
        ESC TO CLOSE
      </text>
    </g>

    <!-- Natural Language Input Area -->
    <g transform="translate(24, 60)">
      <rect width="852" height="64" rx="8" fill="#121217" stroke="#27272a" stroke-width="1" />

      <!-- Input Text with highlighted tokens -->
      <text x="18" y="38" font-size="15" class="code-font">
        <tspan fill="#ffffff" font-weight="600">Draft press release</tspan>
        <tspan fill="#71717a"> </tspan>
        <tspan fill="#38bdf8" font-weight="600">tomorrow</tspan>
        <tspan fill="#71717a"> </tspan>
        <tspan fill="#ef4444" font-weight="700">!urgent</tspan>
        <tspan fill="#71717a"> </tspan>
        <tspan fill="#10b981" font-weight="600">@grace</tspan>
        <tspan fill="#71717a"> </tspan>
        <tspan fill="#f59e0b" font-weight="600">#atlas</tspan>
        <tspan fill="#71717a"> </tspan>
        <tspan fill="#a855f7" font-weight="600">~review</tspan>
        <!-- Blinking caret -->
        <tspan fill="#10b981" font-weight="700" class="caret-pulse">_</tspan>
      </text>
    </g>

    <!-- Reactive Natural Language Parsed Chips -->
    <g transform="translate(24, 142)" class="chip-animate">
      <text x="0" y="18" fill="#71717a" font-size="10" font-weight="700" letter-spacing="1" class="code-font">LIVE NLP TOKEN BREAKDOWN</text>

      <!-- Chip 1: Due Date -->
      <g transform="translate(0, 30)">
        <rect width="130" height="28" rx="6" fill="#0c1d2e" stroke="#0284c7" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="600" class="code-font">📅 Tomorrow</text>
      </g>

      <!-- Chip 2: Priority -->
      <g transform="translate(142, 30)">
        <rect width="120" height="28" rx="6" fill="#2d1012" stroke="#dc2626" stroke-width="1" />
        <text x="12" y="18" fill="#f87171" font-size="11" font-weight="700" class="code-font">⚡ Urgent (P1)</text>
      </g>

      <!-- Chip 3: Assignee -->
      <g transform="translate(274, 30)">
        <rect width="110" height="28" rx="6" fill="#082318" stroke="#059669" stroke-width="1" />
        <text x="12" y="18" fill="#34d399" font-size="11" font-weight="600" class="code-font">👤 @grace</text>
      </g>

      <!-- Chip 4: Project -->
      <g transform="translate(396, 30)">
        <rect width="105" height="28" rx="6" fill="#2b1a06" stroke="#d97706" stroke-width="1" />
        <text x="12" y="18" fill="#fbbf24" font-size="11" font-weight="600" class="code-font">📁 #atlas</text>
      </g>

      <!-- Chip 5: Column / Status -->
      <g transform="translate(513, 30)">
        <rect width="115" height="28" rx="6" fill="#230d31" stroke="#9333ea" stroke-width="1" />
        <text x="12" y="18" fill="#c084fc" font-size="11" font-weight="600" class="code-font">🔄 ~review</text>
      </g>
    </g>

    <!-- Bottom Modal Action Bar -->
    <g transform="translate(24, 218)">
      <line x1="0" y1="0" x2="852" y2="0" stroke="#1f1f26" stroke-width="1" />
      <text x="0" y="22" fill="#71717a" font-size="11" class="code-font">
        <tspan fill="#e4e4e7" font-weight="700">Enter</tspan> Create Task &#160;·&#160;
        <tspan fill="#e4e4e7" font-weight="700">Ctrl+Enter</tspan> Create &amp; Keep Open &#160;·&#160;
        <tspan fill="#e4e4e7" font-weight="700">Tab</tspan> Complete Token
      </text>

      <g transform="translate(732, 7)">
        <rect width="120" height="26" rx="6" fill="#ffffff" />
        <text x="60" y="17" fill="#000000" font-size="11" font-weight="700" text-anchor="middle" class="sans-font">
          Create Task
        </text>
      </g>
    </g>
  </g>
</svg>