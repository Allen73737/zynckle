name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build and migrate on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zynckle
          POSTGRES_USER: zynckle
          POSTGRES_PASSWORD: zynckle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zynckle -d zynckle"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install a minimal TeX Live (so the LaTeX sandbox test runs against real TeX)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends texlive-latex-base > /dev/null
      - name: Compile, test and package
        run: mvn -B verify
      - name: Start the API on a fresh PostgreSQL database (applies Flyway migrations)
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/zynckle
          DATABASE_USERNAME: zynckle
          DATABASE_PASSWORD: zynckle
          PORT: "8080"
        run: |
          java -jar target/zynckle-api-*.jar > api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health > health.json 2>/dev/null; then break; fi
            sleep 2
          done
          cat health.json || { echo "API did not become healthy"; tail -n 80 api.log; exit 1; }
          grep -q "Successfully applied" api.log || { echo "Flyway did not apply migrations"; tail -n 80 api.log; exit 1; }
      - name: Smoke test sign-up, projects and public share links
        run: |
          set -euo pipefail
          B=http://localhost:8080
          TOKEN=$(curl -fsS -X POST $B/api/auth/register -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.test","password":"ci-password-123!"}' | jq -r .token)
          AUTH="Authorization: Bearer $TOKEN"
          PROJECT=$(curl -fsS -X POST $B/api/projects -H "$AUTH" -H 'Content-Type: application/json' -d '{"name":"CI project"}' | jq -r .id)
          printf 'Title,Status\nFirst,To do\nSecond,Done\n' | curl -fsS -X POST "$B/api/projects/$PROJECT/import" -H "$AUTH" -H 'Content-Type: text/csv' --data-binary @- | jq -e '.created == 2'
          DOC=$(curl -fsS -X POST $B/api/documents -H "$AUTH" -H 'Content-Type: application/json' -d '{"title":"CI doc","content":"<p>hi</p>","type":"rich-text"}' | jq -r .id)
          URL=$(curl -fsS -X POST "$B/api/documents/$DOC/share-links" -H "$AUTH" -H 'Content-Type: application/json' -d '{}' | jq -r .url)
          curl -fsS "$B/api/public$URL" | jq -e '.title == "CI doc"'
      - name: API log on failure
        if: failure()
        run: tail -n 200 api.log || true

  frontend:
    name: Frontend · type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    name: Browser tests · main flows and accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start the API (fresh embedded database)
        working-directory: backend
        env:
          PORT: "8080"
          DATABASE_URL: jdbc:h2:mem:e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
          ZYNCKLE_PUBLIC_URL: http://localhost:5173
          ZYNCKLE_FRONTEND_ORIGIN: http://localhost:5173
          AUTH_RATE_PER_MINUTE: "200"
        run: |
          mvn -B -q package -DskipTests
          java -jar target/zynckle-api-*.jar > api.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://localhost:8080/api/health > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:8080/api/health
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
      - name: Playwright report and API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/api.log
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
