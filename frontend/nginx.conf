map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 110m;

    # Security headers (CSP and friends) are in security-headers.conf, included per location below.
    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    # REST API, including server-sent AI streams (no buffering, long reads).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 200s;
    }

    # Static previews of code projects.
    # The API sends its own sandbox CSP for these (opaque origin, no access to the session); this
    # add_header stops the app's CSP being inherited and stacked on top, which would block the site's scripts.
    location /sites/ {
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Workspace events and collaborative editing.
    location ~ ^/(ws|collab) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path (e.g. /share/<token>, /projects/42) serves index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
