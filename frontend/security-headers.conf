# Included in every location of nginx.conf (an add_header inside a location replaces the server's).
#
# Content-Security-Policy, by directive:
#   script-src 'self'          only the app's own bundles; no inline or third-party scripts
#   style-src  'unsafe-inline' React style attributes and diagram (Mermaid) styles; Google Fonts CSS
#   img-src    data: blob: https:   pasted/uploaded images, diagrams, avatars
#   connect-src                 the API and the app's own WebSockets only
#   frame-src  https: http: blob:   Website previews frame other sites; the PDF view uses blob: URLs
#   frame-ancestors 'self'      other sites cannot frame Zynckle (clickjacking)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' ws://$host wss://$host; frame-src 'self' blob: https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
